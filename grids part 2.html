<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grid Layout part 2</title>
<style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">
    body {
        background: lightyellow;
    } #container {
        width: 800px;
        height: 800px;
        background: white;
        border: 1px solid dimgray;
        margin: 24px auto;
        display: grid;
        grid-template: 
        repeat(2,auto)/repeat(2,auto);
    } #container div {
        font: 32pt/1.4em cabin sketch;
        color: darkslateblue
        
    } #container div:nth-child(1) {
        background: lightblue;
        display: none;
        
    } #container div:nth-child(2) {
        background-image: url( klara-kulikova-unsplash.jpg);
        background-size: cover;
        background-position: center;
        grid-area: 1/2/3/3;
        
    } #container div:nth-child(3) {
        background-image: url(aaron-burden-unsplash.jpg);
        background-size: cover;
        background-position:center;
        
    } #container div:nth-child(4) {
        background-image: url(rayia-soderberg-unsplash.jpg);
        background-size:cover;
        background-position: center;
        // display: none;
        grid-area: 1/1;
    }
    @media only screen and (max-width: 750px) {
			#container{
				width: 90%;
				height: 3500px;
				grid-template: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr/auto;}
				#container div:hover{
			background-repeat: no-repeat;
					background-position: center;}
</style>
</head>

<body>
    <h1>Flowers</h1>
    <div id="container">
        <div>1</div>
        <div>Lavender</div>
        <div>Sunflower</div>
        <div>Daisy</div>
    
    </div>
     <p>Images are sourced from unsplashed</p>
</body>
</html>
