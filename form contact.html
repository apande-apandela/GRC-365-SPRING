<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>contact forms</title>
    </head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fascinate+Inline&display=swap" rel="stylesheet">
    
<style>
    .fascinate-inline-regular {
  font-family: "Fascinate Inline", system-ui;
  font-weight: 400;
  font-style: normal;
}
    #headingbanner{
        width: 100.5%;
        height: 80px;
        border: 2px solid darkgray;
        margin: -10px;
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }
    #bannerimg{
        height:80px;
        margin-left: 10px; }
    b{
        font:35px/1.4em "Fascinate Inline"
            margin: auto 20px;}
   
    h1{
			text-align: center;
			font: 48pt/1.4em "Fascinate Inline"; 	
		}
		form{
			width: 70%;
			min-height: 700px;
			background: #469;
			margin: 36px auto;
			padding: 24px;
		}
		label {
			font:14pt/1.5em "Calibri_Bold";
			color: aliceblue;
		}
		input[type="text"] {
			width: 95%;
			font: 14pt/1.4em "Calibri_Bold";
		}
		fieldset{
			margin-top: 18px;
		}
		legend {
			font:14pt/1.4em "Calibri_Bold";
			color: aliceblue;
		}
		textarea{width: 95%}
		input[type="submit"]{
			width: 120px;
			height: 45px;
			background-color: aliceblue;
			margin: 16px auto auto;
			font: 16px/1.4em "Calibri_Bold";
			border: 1px darkgray;
		}
</style>
    
<script language="JavaScript">
	function toggle(source) {
		checkboxes 
			= document.getElementsByName('foo');
		for(var checkbox in checkboxes) checkboxes[checkbox].checked = 
			source.checked;
	}
	</script>
<body>
	<div id="headingBanner">
	<img id="bannerImg" src= tiago-ferreira-QF97dz6lcQw-unsplash.jpg>
	</div>
	<h1>
	Contact Me!
	</h1>
	<form action="https://formsubmit.co/cabred8@unlv.nevada.edu" method="post">  
		<label>First Name</label><br>
		<input type="text" name="fName" required><br>
		<label>Last Name</label><br>
		<input type="text" name="lName" required><br>
		<fieldset><legend>Reason for Contact</legend>
		<input type="radio" name="contact"><label>Commissions</label><br>
		<input type="radio" name="contact"><label>Hire for Projects</label><br>
		<input type="radio" name="contact"><label>Graphic Design Services</label><br>
		<input type="radio" name="contact"><label>Other (Please Specify)</label><br>
		<textarea></textarea>
		</fieldset>
		<fieldset>
			
		<legend>Prefered Operating System</legend>
		
		<input type="checkbox" name="foo"><label>Windows</label><br>
		<input type="checkbox" name="foo"><label>MacOS</label><br>
		<input type="checkbox" name="foo"><label>Linux</label><br>
		<input type="checkbox" onClick="toggle(this)"><label>All of the above</label><br>
			
		</fieldset><br>
		<label>Additional Details</label><br>
		<textarea rows="6"></textarea>
		<input type="submit">
	</form>
</body>
</html>
